<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VITELA — Recomendador de libros</title>
  <link rel="stylesheet" href="css/styles.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&display=swap" rel="stylesheet">
</head>

<body>
  <a class="skip-link" href="#main">Saltar al contenido principal</a>

  <header class="site-header">
    <div class="brand">
      <span class="brand-mark" aria-hidden="true">&#128214;</span>

      <div>
        <h1>VITELA</h1>
        <p class="tagline">
          Encuentra historias que esperan ser descubiertas 
        </p>
      </div>
    </div>
  </header>

  <main id="main">

    <section class="search-section" aria-labelledby="search-heading">
      <h2 id="search-heading" class="visually-hidden">
        Recomendar libros
      </h2>

      <form id="search-form" class="search-form" role="search">

        <div class="field field-grow">
          <label for="search-input">¿Qué te gustaría leer?</label>

          <input
            type="text"
            id="search-input"
            name="q"
            autocomplete="off"
            list="history-list"
            placeholder="Ej. Cien años de soledad"
          >

          <datalist id="history-list"></datalist>
        </div>

        <button type="submit" class="btn btn-primary">
          Recomendar libros
        </button>

        <button
          type="button"
          id="filters-toggle"
          class="btn btn-ghost"
          aria-expanded="false"
          aria-controls="filters-panel"
        >
          Preferencias
        </button>

      </form>

      <div id="filters-panel" class="filters-panel" hidden>

        <div class="field">
          <label for="filter-subject">¿Qué tema te gusta?</label>

          <select id="filter-subject">
            <option value="">Cualquiera</option>
            <option value="fiction">Ficción</option>
            <option value="science">Ciencia</option>
            <option value="history">Historia</option>
            <option value="fantasy">Fantasía</option>
            <option value="biography">Biografía</option>
            <option value="poetry">Poesía</option>
          </select>
        </div>

        <div class="field">
          <label for="filter-language">¿En qué idioma?</label>

          <select id="filter-language">
            <option value="">Cualquiera</option>
            <option value="spa">Español</option>
            <option value="eng">Inglés</option>
            <option value="fre">Francés</option>
            <option value="ger">Alemán</option>
            <option value="por">Portugués</option>
          </select>
        </div>

        <div class="field">
          <label for="filter-sort">¿Cómo quieres ordenar?</label>

          <select id="filter-sort">
            <option value="relevance">Relevancia</option>
            <option value="new">Publicación más reciente</option>
            <option value="old">Publicación más antigua</option>
            <option value="rating">Mejor valorados</option>
          </select>
        </div>

      </div>

      <div
        id="history-chips"
        class="history-chips"
        aria-label="Búsquedas recientes"
      ></div>

    </section>

    <p id="status" class="status" role="status" aria-live="polite"></p>

    <div class="layout">

      <section class="results-section" aria-labelledby="results-heading">
        <h2 id="results-heading">Libros recomendados</h2>

        <ul
          id="results-list"
          class="results-grid"
          aria-busy="false"
        ></ul>
      </section>

      <aside
        class="favorites-section"
        aria-labelledby="favorites-heading"
      >

        <div class="favorites-header">

          <h2 id="favorites-heading">
            <button
              type="button"
              id="favorites-toggle"
              class="btn btn-ghost panel-toggle"
              aria-expanded="true"
              aria-controls="favorites-panel"
            >
              Favoritos
              <span id="favorites-count" class="count-badge">0</span>
            </button>
          </h2>

          <button
            type="button"
            id="clear-favorites"
            class="btn btn-text"
          >
            Vaciar
          </button>

        </div>

        <ul id="favorites-panel" class="favorites-list"></ul>

      </aside>

    </div>

  </main>

  <footer class="site-footer">
    <p>
      Datos de libros y portadas proporcionados por
      <a
        href="https://openlibrary.org"
        target="_blank"
        rel="noopener"
      >
        Open Library
      </a>.
    </p>
  </footer>

  <template id="book-card-template">

    <li class="book-card">

      <div class="book-cover">
        <img src="" alt="" loading="lazy">
      </div>

      <div class="book-info">

        <h3 class="book-title"></h3>

        <p class="book-author"></p>

        <p class="book-year"></p>

        <div class="book-actions">

          <button
            type="button"
            class="btn btn-fav"
            aria-pressed="false"
          >
            ☆ Favorito
          </button>

          <button
            type="button"
            class="btn btn-details"
            aria-expanded="false"
          >
            Ver detalles
          </button>

        </div>

        <div class="book-details" hidden></div>

      </div>

    </li>

  </template>

  <script type="module" src="js/app.mjs"></script>

</body>
</html>
